version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: helpscout-postgres
    environment:
      POSTGRES_USER: helpscout
      POSTGRES_PASSWORD: helpscout
      POSTGRES_DB: helpscout_insights
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpscout"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: helpscout-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://helpscout:helpscout@postgres:5432/helpscout_insights
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
